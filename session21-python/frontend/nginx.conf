server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolve the API hostname per request so nginx
  # can start before the backend container is ready.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    set $api_upstream http://backend:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    set $health_upstream http://backend:8000;
    proxy_pass $health_upstream/health;
  }
}
