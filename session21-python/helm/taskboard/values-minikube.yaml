frontend:
  image: taskboard-frontend
  tag: local
backend:
  image: taskboard-backend
  tag: local
replicaCount: 2
ingress:
  enabled: true
  host: taskboard.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 300m, memory: 256Mi}
monitoring:
  serviceMonitor:
    enabled: false
