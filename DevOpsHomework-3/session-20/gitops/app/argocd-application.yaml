apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-gitops-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kushals256/devops-heros.git
    targetRevision: HEAD
    path: DevOpsHomework-3/session-20/gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
