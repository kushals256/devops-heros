groups:
  - name: session20-demo-alerts
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "A scrape target is down"
          description: "Job {{ $labels.job }} instance {{ $labels.instance }} has been down for more than 1 minute."

      - alert: HighPrometheusProcessCPU
        expr: rate(process_cpu_seconds_total{job="prometheus"}[1m]) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus process CPU is high"
          description: "CPU rate is {{ $value }} cores."
