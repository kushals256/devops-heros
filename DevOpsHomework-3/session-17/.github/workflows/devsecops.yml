name: Session 17 DevSecOps

on:
  workflow_dispatch:
  push:
    paths:
      - "DevOpsHomework-3/session-17/**"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DevOpsHomework-3/session-17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit test
        run: |
          pip install -r requirements.txt
          pytest -q
      - name: Secret scan
        run: |
          if grep -RInE 'AKIA[0-9A-Z]{16}|aws_secret_access_key' . --exclude-dir=.git; then
            echo "secret found"
            exit 1
          fi
          echo "secret scan passed"
      - name: Build image
        run: docker build -t session17-devsecops:local .
      - name: Image scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL --exit-code 0 session17-devsecops:local
