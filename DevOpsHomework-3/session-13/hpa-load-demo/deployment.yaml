apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-demo
  labels:
    app: load-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-demo
  template:
    metadata:
      labels:
        app: load-demo
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command:
            - python
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      # Burn CPU so HPA can scale under load_generator.sh traffic
                      x = 0
                      for i in range(4000000):
                          x += i * i
                      body = b'{"status":"ok"}'
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(('0.0.0.0', 5000), H).serve_forever()
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "20m"
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: load-demo
spec:
  selector:
    app: load-demo
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: load-demo-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: load-demo
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 40
