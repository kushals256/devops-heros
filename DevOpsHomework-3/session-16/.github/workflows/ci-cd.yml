name: Session 16 CI/CD

on:
  push:
    paths:
      - "DevOpsHomework-3/session-16/**"
  pull_request:
    paths:
      - "DevOpsHomework-3/session-16/**"
  workflow_dispatch:

env:
  WORKING_DIR: DevOpsHomework-3/session-16

jobs:
  # ---------- CI ----------
  test:
    name: CI — Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          pip install -r requirements.txt
          pytest -q
      - name: Upload test summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: DevOpsHomework-3/session-16/pytest.ini

  build:
    name: CI — Build image
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t session16-cicd:${{ github.sha }} .
      - name: Smoke-run container
        run: |
          docker run -d --name s16 -p 8080:8080 session16-cicd:${{ github.sha }}
          sleep 2
          curl -sf http://localhost:8080/health
          docker stop s16
      - name: Save image artifact
        run: docker save session16-cicd:${{ github.sha }} -o /tmp/session16-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: session16-image
          path: /tmp/session16-image.tar

  # ---------- CD ----------
  deploy:
    name: CD — Push to GHCR
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: session16-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/session16-image.tar
      - name: Login to GHCR (uses GITHUB_TOKEN secret)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Demonstrate optional custom secret presence
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -n "$DEMO_TOKEN" ]; then
            echo "Optional secret DEMO_TOKEN is configured (value redacted)."
          else
            echo "Optional secret DEMO_TOKEN not set — GITHUB_TOKEN alone is used for GHCR."
          fi
      - name: Tag and push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag session16-cicd:${{ github.sha }} "ghcr.io/${OWNER}/session16-cicd:${{ github.sha }}"
          docker tag session16-cicd:${{ github.sha }} "ghcr.io/${OWNER}/session16-cicd:latest"
          docker push "ghcr.io/${OWNER}/session16-cicd:${{ github.sha }}"
          docker push "ghcr.io/${OWNER}/session16-cicd:latest"
